<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-labelledby="title"><title id="title">Two labelled columns distinguishing educational capabilities from unassessed clinical questions</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#294d49"/></marker></defs><rect width="760" height="350" rx="18" fill="#f3f2e6"/><g font-family="Arial,sans-serif" stroke-linejoin="round"><rect x="55" y="55" width="290" height="240" rx="12" fill="#dfe9d7"/><rect x="415" y="55" width="290" height="240" rx="12" fill="#eae0d5"/><text x="200" y="100" font-size="25" fill="#294d49" text-anchor="middle">Can illustrate</text><text x="560" y="100" font-size="25" fill="#294d49" text-anchor="middle">Cannot assess</text><text x="80" y="155" font-size="19" fill="#294d49" text-anchor="start">A task or adaptation</text><text x="440" y="155" font-size="19" fill="#294d49" text-anchor="start">Your joint stability</text><text x="80" y="205" font-size="19" fill="#294d49" text-anchor="start">A chosen setup</text><text x="440" y="205" font-size="19" fill="#294d49" text-anchor="start">A safe lifting load</text><text x="80" y="255" font-size="19" fill="#294d49" text-anchor="start">Your own observations</text><text x="440" y="255" font-size="19" fill="#294d49" text-anchor="start">Treatment effectiveness</text></g></svg>