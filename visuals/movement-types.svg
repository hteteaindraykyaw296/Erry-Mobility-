<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-labelledby="title"><title id="title">Four schematic movement-pattern symbols with type and feature labels; not patient traces</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#294d49"/></marker></defs><rect width="760" height="350" rx="18" fill="#f3f2e6"/><g font-family="Arial,sans-serif" stroke-linejoin="round"><rect x="20" y="45" width="165" height="250" rx="12" fill="#fffdf6"/><text x="102" y="85" font-size="21" fill="#294d49" text-anchor="middle">Spastic</text><path d="M60 165 Q100 115 145 150" stroke="#75997e" stroke-width="9" fill="none" stroke-linecap="round"/><text x="102" y="245" font-size="14" fill="#294d49" text-anchor="middle">Stiffness</text><rect x="205" y="45" width="165" height="250" rx="12" fill="#fffdf6"/><text x="287" y="85" font-size="21" fill="#294d49" text-anchor="middle">Dyskinetic</text><path d="M245 165 C255 80 315 235 350 135" stroke="#6c99b3" stroke-width="9" fill="none" stroke-linecap="round"/><text x="287" y="245" font-size="14" fill="#294d49" text-anchor="middle">Involuntary movement</text><rect x="390" y="45" width="165" height="250" rx="12" fill="#fffdf6"/><text x="472" y="85" font-size="21" fill="#294d49" text-anchor="middle">Ataxic</text><path d="M430 165 L460 120 L490 185 L535 135" stroke="#ddba70" stroke-width="9" fill="none" stroke-linecap="round"/><text x="472" y="245" font-size="14" fill="#294d49" text-anchor="middle">Coordination</text><rect x="575" y="45" width="165" height="250" rx="12" fill="#fffdf6"/><text x="657" y="85" font-size="21" fill="#294d49" text-anchor="middle">Mixed</text><path d="M615 165 Q650 100 670 150 T720 140" stroke="#9b8eb5" stroke-width="9" fill="none" stroke-linecap="round"/><text x="657" y="245" font-size="14" fill="#294d49" text-anchor="middle">Combined features</text></g></svg>