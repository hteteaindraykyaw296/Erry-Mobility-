<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-labelledby="title"><title id="title">A pen with a wider grip and a shirt with larger fastenings, labelled as adaptations</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#294d49"/></marker></defs><rect width="760" height="350" rx="18" fill="#f3f2e6"/><g font-family="Arial,sans-serif" stroke-linejoin="round"><rect x="40" y="70" width="280" height="240" rx="12" fill="#fffdf6"/><g transform="translate(155 90) rotate(-25) scale(0.8)"><rect x="0" y="0" width="20" height="165" rx="6" fill="#6c99b3"/><rect x="-8" y="70" width="36" height="65" rx="12" fill="#ddba70"/><path d="M0 165 L10 190 L20 165" fill="#766047"/></g><path d="M170 188 L225 142" fill="none" stroke="#6d8274" stroke-width="2"/><circle cx="170" cy="188" r="4" fill="#294d49"/><text x="231" y="147" font-size="19" fill="#294d49" text-anchor="start">Grip aid</text><text x="65" y="280" font-size="22" fill="#294d49" text-anchor="start">Pen or stylus</text><path d="M445 85 L500 65 L548 85 L590 135 L553 165 L535 142 V290 H420 V142 L402 165 L365 135 Z" fill="#6c99b3" stroke="#294d49" stroke-width="3"/><circle cx="480" cy="135" r="9" fill="#ddba70"/><circle cx="480" cy="180" r="9" fill="#ddba70"/><circle cx="480" cy="225" r="9" fill="#ddba70"/><path d="M480 180 L595 185" fill="none" stroke="#6d8274" stroke-width="2"/><circle cx="480" cy="180" r="4" fill="#294d49"/><text x="601" y="190" font-size="19" fill="#294d49" text-anchor="start">Larger fastening</text><text x="390" y="325" font-size="19" fill="#294d49" text-anchor="start">Adapt the task, not a required grasp</text></g></svg>