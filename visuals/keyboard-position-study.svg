<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 530" role="img" aria-labelledby="title desc">
<title id="title">Same keyboard, closer to the front edge</title>
<desc id="desc">The keyboard shifts towards the same front desk edge between Setup A and Setup B. The gold E key marks the same target in both. A shorter line indicates the smaller gap in Setup B.</desc>
