<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-labelledby="title"><title id="title">A care-planning checklist, protection symbol and child illustration for risk reduction</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#294d49"/></marker></defs><rect width="760" height="350" rx="18" fill="#f3f2e6"/><g font-family="Arial,sans-serif" stroke-linejoin="round"><rect x="35" y="50" width="190" height="240" rx="12" fill="#fffdf6"/><circle cx="130" cy="125" r="50" fill="#dbe6d0"/><text x="130" y="230" font-size="22" fill="#294d49" text-anchor="middle">Plan care</text><text x="130" y="267" font-size="18" fill="#294d49" text-anchor="middle">1</text><rect x="285" y="50" width="190" height="240" rx="12" fill="#fffdf6"/><circle cx="380" cy="125" r="50" fill="#d4e6ed"/><text x="380" y="230" font-size="22" fill="#294d49" text-anchor="middle">Pregnancy care</text><text x="380" y="267" font-size="18" fill="#294d49" text-anchor="middle">2</text><rect x="535" y="50" width="190" height="240" rx="12" fill="#fffdf6"/><circle cx="630" cy="125" r="50" fill="#ecdacb"/><text x="630" y="230" font-size="22" fill="#294d49" text-anchor="middle">Child health</text><text x="630" y="267" font-size="18" fill="#294d49" text-anchor="middle">3</text><rect x="107" y="95" width="46" height="65" rx="4" fill="#fffdf4"/><path d="M115 110 L144 110" fill="none" stroke="#294d49" stroke-width="3"/><path d="M115 126 L144 126" fill="none" stroke="#294d49" stroke-width="3"/><path d="M115 142 L135 142" fill="none" stroke="#294d49" stroke-width="3"/><path d="M380 90 L415 107 V137 Q410 160 380 170 Q350 160 345 137 V107 Z" fill="#75997e"/><path d="M363 128 L376 142" fill="none" stroke="#fffdf4" stroke-width="5"/><path d="M376 142 L400 112" fill="none" stroke="#fffdf4" stroke-width="5"/><g transform="translate(630 99) scale(0.4)"><circle cx="0" cy="0" r="22" fill="#c58b73"/><path d="M0 30 V115 M0 48 L-48 90 M0 48 L50 80 M0 115 L-35 192 M0 115 L38 192" stroke="#294d49" stroke-width="17" stroke-linecap="round" fill="none"/></g><text x="380" y="324" font-size="19" fill="#294d49" text-anchor="middle">Some risks can be reduced. Not every case can be prevented.</text></g></svg>