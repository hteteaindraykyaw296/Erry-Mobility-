<section data-story="a" aria-labelledby="title-a">
<h2 id="title-a">A · Reach, contact and press</h2>
<p>Follow a fingertip through approach, contact, press and release.</p>
<figure><div class="plate frame"><img src="media/phase-3/a.png" alt="An index finger approaches, contacts and depresses the same gold key. The raised pose is reused to illustrate release."></div><figcaption role="status"></figcaption></figure>
<div class="controls"></div>
<details><summary>Read all four stages</summary><ol><li>Reach towards the gold key.</li><li>Make fingertip contact.</li><li>Depress the key as the finger and hand angle adjust.</li><li>Release the key and reposition if needed. The approach frame is reused to show the finger clear of the key.</li></ol></details>
<p><small>Illustrative poses. Joint angles and key travel are unmeasured.</small></p>

<p>Follow one simplified example of how the nervous system contributes to a voluntary reach.</p>
<figure><div class="plate motor" data-phase="0"><img src="media/phase-3/b.png" alt="A faceless translucent upper body with the brain and spinal pathway connected to an extended arm and highlighted forearm muscles.">

<g class="phase signal" fill="none" stroke="#ffe38d" stroke-width="9" stroke-linecap="round" marker-end="url(#outbound)"><path d="M510 132Q488 185 481 258"/><path d="M498 284Q520 320 589 349T710 440Q775 540 902 583"/></g>

</svg></div><figcaption role="status"></figcaption></figure>
<div class="controls"></div>
<details><summary>Read all four stages</summary><ol><li>Brain networks help select and plan the action.</li><li>Descending pathways influence spinal circuits. Motor neurons signal muscles through peripheral nerves.</li><li>Muscles activate and help move or stabilise joints as the hand approaches the target.</li><li>Touch, vision and body-position information help guide adjustments.</li></ol></details>

<p class="legend"><span>Motor planning and output</span><span>Sensory feedback during movement</span></p>
<p>Apply the same sequence to a keyboard reach. Choose a target key, start moving towards it, and use vision, touch and body-position information to adjust the reach and press.</p>
<details><summary>Open the simplified motor-control schematic</summary>
<figure class="diagram"><img src="media/phase-3/motor-schematic.svg" alt="Brain motor networks send descending signals to spinal circuits. Spinal motor neurons activate muscles through peripheral nerves. Sensory signals from the moving limb return to spinal circuits and brain networks. Vision supplies additional information to the brain.">
<figcaption>Descending signals influence spinal circuits. Peripheral motor neurons carry output to muscle. Touch and proprioceptive signals enter the spinal cord through sensory pathways and can influence spinal circuits and ascend to the brain. Vision supplies additional input through a separate route. These processes overlap throughout the reach.</figcaption></figure>
</details>
<p><small>AI-assisted concept illustration with animated teaching overlays. The brain silhouette, cervical cord and continuity into the arm are readable. The render does not resolve spinal roots, individual peripheral nerves or specific forearm muscles, and the overlay paths are schematic. See the <a href="https://www.ncbi.nlm.nih.gov/books/NBK11139/">neuroscience reference</a>.</small></p>
</section>
<section data-study="c" aria-labelledby="title-c">
<h2 id="title-c">C · Fitted keyguard and alignment</h2>
<div class="pair">
<figure><div class="plate half"><img src="media/phase-3/c.png" alt="Fitted sage guard with an opening around each ivory key."></div><figcaption><strong>Fitted.</strong> The sage grid separates the ivory keys into individual openings.</figcaption></figure>
<figure><div class="plate half exploded"><img src="media/phase-3/c.png" alt="Same guard lifted above the keyboard, with orange markers near the edges."></div><figcaption><strong>Exploded.</strong> The raised view shows the intended alignment. Terracotta marks show example registration points.</figcaption></figure>
</div>

<p>The renders show a four-row by five-column guard pattern and a matching key layout where visible. The raised guard obscures part of the key field. Perspective renders cannot establish pitch, concentricity or tolerances. The aligned views below show the intended geometry.</p>
<div class="pair">
<figure class="diagram"><img src="media/phase-3/keyguard-top.svg" alt="Top view with twenty openings and centred key outlines. Four labelled callouts show opening width, centre-to-centre key spacing, shared wall thickness and two example locating tabs.">
<figcaption><strong>Top view · Concept drawing</strong><dl><dt>1 · Opening width</dt><dd>Inside edge to inside edge of an aperture.</dd><dt>2 · Key spacing</dt><dd>Centre-to-centre pitch along a row.</dd><dt>3 · Wall thickness</dt><dd>Material between adjacent apertures.</dd><dt>4 · Registration and retention</dt><dd>Terracotta tabs illustrate possible locating points. Retention would need its own fit and release check.</dd></dl></figcaption></figure>
<figure class="diagram"><img src="media/phase-3/keyguard-section.svg" alt="Cross-section through one key and the guard. A vertical dimension marks the clearance above the keyboard deck, and a second dimension marks travel from the rest position to the depressed position.">
<figcaption><strong>Cross-section · Concept drawing</strong><dl><dt>5 · Plate clearance</dt><dd>Gap between the guard underside and the deck in this section. Check the moving keycap and neighbouring keys separately.</dd><dt>6 · Key travel</dt><dd>Distance from the resting keycap to the illustrated depressed position.</dd></dl></figcaption></figure>
</div>
<details><summary>Material and manufacturing considerations</summary><p>Compare stiffness, edge comfort, cleanability and the retention method. A printed concept may help assess fit, but print orientation, tolerances and surface finish can affect individual apertures. Machining or moulding would require process-specific design checks. Measure the target keyboard before choosing any dimension or material.</p></details>
<p><small>AI-assisted product renders and schematic drawings. Dimensions are conceptual. No physical fit, material or manufacturing tests were performed.</small></p>
</section>
